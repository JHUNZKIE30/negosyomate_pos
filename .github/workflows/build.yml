
name: Build NegosyoMate POS for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'main.js'
      - 'package.json'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NegosyoMate-POS-Windows
          path: dist/*.exe
